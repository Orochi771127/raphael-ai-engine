name: Raphael Sovereign Engine CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sovereign-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out engine
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Run contract and sovereign suites
        run: |
          npm test
          node tests/sovereign-runtime-v1.test.mjs
          node tests/shadow-runner.test.mjs
          npm run probe:nexuslink
